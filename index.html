<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>distant bugles</title>

  <style>
    :root{
      --fg:#111;
      --bg:#fff;
      --muted:rgba(0,0,0,.58);
      --rule:rgba(0,0,0,.10);
      --panel:#f6f6f4;
      --red:#b01818;
    }

    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font:18px/1.7 ui-monospace,"SF Mono",Menlo,Monaco,Consolas,"Liberation Mono","Courier New",Courier,monospace;
    }

    main{
      max-width:560px;
      margin:9vh auto;
      padding:0 22px;
    }

    /* CENTER THE TOP */
    .brand{
      opacity:.75;
      letter-spacing:.18em;
      text-transform:lowercase;
      margin-bottom:10px;
      text-align:center;
    }

    .byline{
      text-align:center;
      margin:0 0 18px;
      font-size:13px;
      color:var(--muted);
    }

    .small{font-size:13px;color:var(--muted);margin:10px 0}
    a{color:inherit;text-decoration:underline;text-underline-offset:3px}

    /* PANEL AROUND RECORD (subtle plinth) */
    .panel{
      background:var(--panel);
      border-radius:18px;
      padding:22px 18px 18px;
      box-shadow:
        0 16px 40px rgba(0,0,0,.06),
        inset 0 0 0 1px rgba(0,0,0,.06);
    }

    /* stage is layout only */
    .stage{
      width:100%;
      aspect-ratio: 1 / 1;
      position:relative;
      display:grid;
      place-items:center;
      overflow:visible;
    }

    /* record */
    .disc{
      width:86%;
      aspect-ratio:1/1;
      border-radius:50%;
      position:relative;
      overflow:hidden;
      box-shadow: 0 18px 55px rgba(0,0,0,.22);
    }

    .discBase{
      position:absolute; inset:0; border-radius:50%;
      background:
        radial-gradient(circle at 50% 45%, rgba(255,255,255,.05), rgba(0,0,0,0) 55%),
        radial-gradient(circle at center, #2a2a2c 0%, #111114 62%, #0b0b0c 100%);
    }

    .discGrooves{
      position:absolute; inset:0; border-radius:50%;
      opacity:.24;
      background: repeating-radial-gradient(circle at center,
        rgba(255,255,255,.06) 0px,
        rgba(255,255,255,.06) 1px,
        rgba(0,0,0,0) 3px,
        rgba(0,0,0,0) 6px
      );
      mix-blend-mode: screen;
      -webkit-mask-image: radial-gradient(circle at center, transparent 0 28%, #000 30% 100%);
      mask-image: radial-gradient(circle at center, transparent 0 28%, #000 30% 100%);
    }

    .discSheen{
      position:absolute; inset:-35%;
      border-radius:50%;
      opacity:.32;
      background: conic-gradient(
        from 0deg,
        rgba(255,255,255,0.00) 0deg,
        rgba(255,255,255,0.14) 22deg,
        rgba(255,255,255,0.00) 70deg,
        rgba(255,255,255,0.00) 180deg,
        rgba(255,255,255,0.10) 230deg,
        rgba(255,255,255,0.00) 290deg,
        rgba(255,255,255,0.00) 360deg
      );
      mix-blend-mode: screen;
      pointer-events:none;
    }

    .label{
      position:absolute; inset:0; margin:auto;
      width:22%;
      aspect-ratio:1/1;
      border-radius:50%;
      background: radial-gradient(circle at center,
        rgba(255,255,255,.08),
        rgba(255,255,255,.03) 55%,
        rgba(255,255,255,.05)
      );
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: inset 0 0 0 6px rgba(0,0,0,.18);
      display:flex; justify-content:center; align-items:center;
    }

    .hole{
      width:28%;
      aspect-ratio:1/1;
      border-radius:50%;
      background: rgba(0,0,0,.88);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.10);
    }

    @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
    .stage.spinning .disc{ animation: spin 2.2s linear infinite; }

    @media (prefers-reduced-motion: reduce){
      .stage.spinning .disc{ animation:none; }
    }

    /* now playing (inside panel, aligned like footer) */
    .np{
      margin-top:16px;
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:14px;
    }

    .npText{
      opacity:0;
      transform: translateY(4px);
      transition: opacity 260ms ease, transform 260ms ease;
    }

    .stage.spinning ~ .np .npText{
      opacity:1;
      transform: translateY(0);
    }

    /* UPDATED: italic, lighter “now playing:” */
    .npLabel{
      font-size:13px;
      color:rgba(0,0,0,.45);
      font-style: italic;
      letter-spacing:.04em;
      text-transform:lowercase;
    }

    .npTitle{
      margin-top:2px;
      font-size:16px;
      color:rgba(0,0,0,.78);
      letter-spacing:.12em;
      text-transform:lowercase;
    }

    /* power button */
    .powerBtn{
      appearance:none;
      border:1px solid rgba(0,0,0,.18);
      background: rgba(255,255,255,.92);
      border-radius:999px;
      width:56px;
      height:56px;
      display:grid;
      place-items:center;
      cursor:pointer;
      box-shadow: 0 8px 22px rgba(0,0,0,.10);
      flex:0 0 auto;
    }
    .powerBtn:active{ transform: translateY(1px); }

    .powerIcon{
      width:20px;
      height:20px;
      opacity:.85;
      color: rgba(0,0,0,.70);
      transition: color 200ms ease, filter 200ms ease;
    }

    /* obvious red when playing */
    .stage.spinning ~ .np .powerIcon{
      color: var(--red);
      filter: drop-shadow(0 0 7px rgba(176,24,24,.25));
    }

    /* footer spacing from panel */
    .footer{
      margin-top:18px;
      text-align:left;
    }
    .footerCenter{
      text-align:center;
    }

    /* UPDATED: center the link row */
    .links{
      text-align:center;
    }

    /* Hide native audio UI */
    audio{ display:none; }
  </style>
</head>

<body>
  <main>
    <div class="brand">distant bugles</div>
    <p class="byline">music by Steve Ward and friends</p>

    <div class="panel">
      <div id="stage" class="stage" aria-label="player">
        <div class="disc" aria-hidden="true">
          <div class="discBase"></div>
          <div class="discGrooves"></div>
          <div class="discSheen"></div>
          <div class="label"><div class="hole"></div></div>
        </div>
      </div>

      <div class="np">
        <div class="npText" aria-hidden="true">
          <div class="npLabel">now playing:</div>
          <div class="npTitle" id="trackTitle">cold moon</div>
        </div>

        <button id="toggle" class="powerBtn" type="button" aria-label="play or pause">
          <svg class="powerIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2v9"></path>
            <path d="M7.5 4.8a8 8 0 1 0 9 0"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="footer">
      <p class="small footerCenter">things will change.</p>
      <p class="small">if you hear something you want: email me a lyric, a timestamp, or a description.</p>

      <p class="small links">
        <a href="https://fauna-flora.bandcamp.com/album/fauna-flora" target="_blank" rel="noopener noreferrer">bandcamp</a>
        <span style="margin:0 10px;">·</span>
        <a href="mailto:faunafloramusic@gmail.com?subject=Hello">contact</a>
      </p>
    </div>

    <audio id="player" preload="none">
      <source src="audio/cold_moon_16_44_1_FLAC_export_2026_01_12.flac" type="audio/flac">
    </audio>
  </main>

  <script>
  (() => {
    const audio = document.getElementById("player");
    const stage = document.getElementById("stage");
    const btn   = document.getElementById("toggle");
    if (!audio || !stage || !btn) return;

    const setUI = () => {
      const playing = !audio.paused && !audio.ended;
      stage.classList.toggle("spinning", playing);
      btn.setAttribute("aria-label", playing ? "pause" : "play");
    };

    btn.addEventListener("click", async () => {
      try{
        if (audio.paused || audio.ended) await audio.play();
        else audio.pause();
      } catch(e) {}
      setUI();
    });

    audio.addEventListener("playing", setUI);
    audio.addEventListener("pause", setUI);
    audio.addEventListener("ended", setUI);

    setUI();
  })();
  </script>
</body>
</html>
