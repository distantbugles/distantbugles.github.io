<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>distant bugles</title>

  <style>
    :root{
      --fg:#111;
      --bg:#fff;
      --muted:rgba(0,0,0,.58);
      --rule:rgba(0,0,0,.10);

      /* 0..1 progress used for tonearm */
      --p: 0;
    }

    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font:18px/1.7 ui-monospace,"SF Mono",Menlo,Monaco,Consolas,"Liberation Mono","Courier New",Courier,monospace;
    }
    main{max-width:760px;margin:9vh auto;padding:0 22px}
    .brand{opacity:.75;letter-spacing:.18em;text-transform:lowercase;margin-bottom:14px}
    .small{font-size:13px;color:var(--muted);margin:10px 0}
    hr{border:0;height:1px;background:var(--rule);margin:18px 0}
    a{color:inherit;text-decoration:underline;text-underline-offset:3px}

    /* ---------- RECORD + ARM STAGE ---------- */
    .stage{
      margin-top:14px;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:28px;
      user-select:none;
    }

    .disc{
      width:min(420px, 86vw);
      aspect-ratio:1/1;
      border-radius:50%;
      position:relative;
      overflow:hidden;
      box-shadow: 0 18px 55px rgba(0,0,0,.22);
    }

    .discBase{
      position:absolute; inset:0; border-radius:50%;
      background:
        radial-gradient(circle at 50% 45%, rgba(255,255,255,.05), rgba(0,0,0,0) 55%),
        radial-gradient(circle at center, #2a2a2c 0%, #111114 62%, #0b0b0c 100%);
    }

    .discDeadwax{
      position:absolute; inset:0; border-radius:50%;
      background: radial-gradient(circle at center,
        rgba(255,255,255,.00) 0 24%,
        rgba(255,255,255,.06) 24% 26%,
        rgba(255,255,255,.03) 26% 30%,
        rgba(255,255,255,.00) 30% 100%
      );
      mix-blend-mode: screen;
      opacity: .35;
      pointer-events:none;
    }

    .discGrooves{
      position:absolute; inset:0; border-radius:50%;
      opacity: .24;
      background:
        repeating-radial-gradient(circle at center,
          rgba(255,255,255,.06) 0px,
          rgba(255,255,255,.06) 1px,
          rgba(0,0,0,0) 3px,
          rgba(0,0,0,0) 6px
        );
      mix-blend-mode: screen;
      -webkit-mask-image: radial-gradient(circle at center,
        transparent 0 28%,
        #000 30% 100%
      );
      mask-image: radial-gradient(circle at center,
        transparent 0 28%,
        #000 30% 100%
      );
    }

    .discSheen{
      position:absolute; inset:-35%;
      border-radius:50%;
      opacity:.32;
      background: conic-gradient(
        from 0deg,
        rgba(255,255,255,0.00) 0deg,
        rgba(255,255,255,0.14) 22deg,
        rgba(255,255,255,0.00) 70deg,
        rgba(255,255,255,0.00) 180deg,
        rgba(255,255,255,0.10) 230deg,
        rgba(255,255,255,0.00) 290deg,
        rgba(255,255,255,0.00) 360deg
      );
      mix-blend-mode: screen;
      pointer-events:none;
    }

    .label{
      position:absolute; inset:0; margin:auto;
      width:22%;
      aspect-ratio:1/1;
      border-radius:50%;
      background: radial-gradient(circle at center,
        rgba(255,255,255,.08),
        rgba(255,255,255,.03) 55%,
        rgba(255,255,255,.05)
      );
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: inset 0 0 0 6px rgba(0,0,0,.18);
      display:flex;
      justify-content:center;
      align-items:center;
    }
    .hole{
      width:28%;
      aspect-ratio:1/1;
      border-radius:50%;
      background: rgba(0,0,0,.88);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.10);
    }

    @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
    .spinning .disc{ animation: spin 2.2s linear infinite; }

    @media (max-width: 720px){
      .stage{flex-direction:column; gap:16px;}
    }

    /* ---------- TONEARM (simple, disembodied) ---------- */
    .armWrap{
      width:160px;
      height:260px;
      position:relative;
    }

    /* pivot base */
    .pivot{
      position:absolute;
      right:12px;
      top:26px;
      width:26px;
      height:26px;
      border-radius:50%;
      background: rgba(0,0,0,.12);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.18);
    }
    .pivot::after{
      content:"";
      position:absolute;
      inset:7px;
      border-radius:50%;
      background: rgba(0,0,0,.35);
    }

    /* the arm */
    .arm{
      position:absolute;
      right:25px;
      top:39px;
      width:170px;
      height:10px;
      transform-origin: 162px 5px; /* near pivot */
      transform: rotate(calc(-22deg + (var(--p) * 18deg)));
      transition: transform 80ms linear;
    }

    .arm::before{
      content:"";
      position:absolute;
      left:0;
      top:4px;
      width:165px;
      height:2px;
      background: rgba(0,0,0,.55);
      box-shadow: 0 0 0 1px rgba(0,0,0,.10);
    }

    /* cartridge at the end */
    .cartridge{
      position:absolute;
      left:0;
      top:0;
      width:18px;
      height:10px;
      background: rgba(0,0,0,.55);
      border-radius:2px;
    }

    /* tiny red stylus tip */
    .stylus{
      position:absolute;
      left:-3px;
      top:6px;
      width:6px;
      height:3px;
      background: #b01818;
      border-radius:2px;
      box-shadow: 0 0 0 1px rgba(0,0,0,.10);
    }

    /* optional micro “tracking wobble” when playing */
    .spinning .arm{
      animation: wobble 1.1s ease-in-out infinite;
    }
    @keyframes wobble{
      0%,100%{ filter:none; }
      50%{ filter:brightness(1.03); }
    }
    @media (prefers-reduced-motion: reduce){
      .spinning .arm{ animation:none; }
    }
  </style>
</head>

<body>
  <main>
    <div class="brand">distant bugles</div>

    <p class="small">Music by Steve Ward and friends.</p>
    <hr>

    <div style="margin:18px 0;">
      <div class="small">now playing: cold moon</div>

      <audio id="player" controls loop preload="none" style="width:100%; margin-top:8px;">
        <source src="audio/cold_moon_16_44_1_FLAC_export_2026_01_12.flac" type="audio/flac">
      </audio>

      <div id="wrap" class="stage" aria-hidden="true">
        <div id="disc" class="disc">
          <div class="discBase"></div>
          <div class="discDeadwax"></div>
          <div class="discGrooves"></div>
          <div class="discSheen"></div>
          <div class="label"><div class="hole"></div></div>
        </div>

        <div class="armWrap">
          <div class="pivot"></div>
          <div id="arm" class="arm">
            <div class="cartridge"></div>
            <div class="stylus"></div>
          </div>
        </div>
      </div>
    </div>

    <p class="small">things will change.</p>
    <p class="small">if you hear something you want: email me a lyric, a timestamp, or a description.</p>

    <p class="small">
      <a href="https://fauna-flora.bandcamp.com/album/fauna-flora" target="_blank" rel="noopener noreferrer">bandcamp</a>
      <span style="margin:0 10px;">·</span>
      <a href="mailto:faunafloramusic@gmail.com?subject=Hello">contact</a>
    </p>
  </main>

  <script>
  (() => {
    const audio = document.getElementById("player");
    const wrap  = document.getElementById("wrap");
    if (!audio || !wrap) return;

    const setProgress = (p) => {
      // clamp 0..1
      const v = Math.max(0, Math.min(1, p || 0));
      document.documentElement.style.setProperty("--p", v.toFixed(4));
    };

    const start = () => wrap.classList.add("spinning");
    const stop  = () => wrap.classList.remove("spinning");

    audio.addEventListener("playing", start);
    audio.addEventListener("play", start);
    audio.addEventListener("pause", stop);
    audio.addEventListener("ended", () => { stop(); setProgress(0); });

    // move tonearm inward as the track plays
    audio.addEventListener("timeupdate", () => {
      if (!audio.duration || !isFinite(audio.duration)) return;
      setProgress(audio.currentTime / audio.duration);
    });

    // initialize if already mid-track
    if (!audio.paused && !audio.ended) start();
  })();
  </script>
</body>
</html>
