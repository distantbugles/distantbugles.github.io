<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>distant bugles</title>

  <style>
    :root{
      --fg:#111;
      --bg:#fff;
      --muted:rgba(0,0,0,.58);
      --rule:rgba(0,0,0,.10);
    }

    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font:18px/1.7 ui-monospace,"SF Mono",Menlo,Monaco,Consolas,"Liberation Mono","Courier New",Courier,monospace;
    }

    /* tighter, more “square island” */
    main{
      max-width:560px;
      margin:9vh auto;
      padding:0 22px;
    }

    .brand{
      opacity:.75;
      letter-spacing:.18em;
      text-transform:lowercase;
      margin-bottom:14px;
    }

    .small{font-size:13px;color:var(--muted);margin:10px 0}
    hr{border:0;height:1px;background:var(--rule);margin:18px 0}
    a{color:inherit;text-decoration:underline;text-underline-offset:3px}

    /* --- SQUARE STAGE (record inside a square) --- */
    .stage{
      margin:18px 0 8px;
      width:100%;
      aspect-ratio: 1 / 1;
      border:1px solid var(--rule);
      background:#f7f7f6;
      position:relative;
      overflow:hidden;
      display:grid;
      place-items:center;
      box-shadow: 0 10px 28px rgba(0,0,0,.06);
    }

    /* record */
    .disc{
      width:88%;
      aspect-ratio:1/1;
      border-radius:50%;
      position:relative;
      overflow:hidden;
      box-shadow: 0 18px 55px rgba(0,0,0,.22);
    }

    .discBase{
      position:absolute; inset:0; border-radius:50%;
      background:
        radial-gradient(circle at 50% 45%, rgba(255,255,255,.05), rgba(0,0,0,0) 55%),
        radial-gradient(circle at center, #2a2a2c 0%, #111114 62%, #0b0b0c 100%);
    }

    .discGrooves{
      position:absolute; inset:0; border-radius:50%;
      opacity:.24;
      background: repeating-radial-gradient(circle at center,
        rgba(255,255,255,.06) 0px,
        rgba(255,255,255,.06) 1px,
        rgba(0,0,0,0) 3px,
        rgba(0,0,0,0) 6px
      );
      mix-blend-mode: screen;
      -webkit-mask-image: radial-gradient(circle at center, transparent 0 28%, #000 30% 100%);
      mask-image: radial-gradient(circle at center, transparent 0 28%, #000 30% 100%);
    }

    .discSheen{
      position:absolute; inset:-35%;
      border-radius:50%;
      opacity:.32;
      background: conic-gradient(
        from 0deg,
        rgba(255,255,255,0.00) 0deg,
        rgba(255,255,255,0.14) 22deg,
        rgba(255,255,255,0.00) 70deg,
        rgba(255,255,255,0.00) 180deg,
        rgba(255,255,255,0.10) 230deg,
        rgba(255,255,255,0.00) 290deg,
        rgba(255,255,255,0.00) 360deg
      );
      mix-blend-mode: screen;
      pointer-events:none;
    }

    .label{
      position:absolute; inset:0; margin:auto;
      width:22%;
      aspect-ratio:1/1;
      border-radius:50%;
      background: radial-gradient(circle at center,
        rgba(255,255,255,.08),
        rgba(255,255,255,.03) 55%,
        rgba(255,255,255,.05)
      );
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: inset 0 0 0 6px rgba(0,0,0,.18);
      display:flex; justify-content:center; align-items:center;
    }

    .hole{
      width:28%;
      aspect-ratio:1/1;
      border-radius:50%;
      background: rgba(0,0,0,.88);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.10);
    }

    @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
    .stage.spinning .disc{ animation: spin 2.2s linear infinite; }

    @media (prefers-reduced-motion: reduce){
      .stage.spinning .disc{ animation:none; }
    }

    /* --- minimal “turntable” control button (bottom-right) --- */
    .controls{
      position:absolute;
      right:14px;
      bottom:14px;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .btn{
      appearance:none;
      border:1px solid rgba(0,0,0,.20);
      background: rgba(255,255,255,.80);
      color: rgba(0,0,0,.78);
      padding:10px 12px;
      border-radius:999px;
      cursor:pointer;
      font: 12px/1 ui-monospace,"SF Mono",Menlo,Monaco,Consolas,"Liberation Mono","Courier New",Courier,monospace;
      letter-spacing:.10em;
      text-transform:lowercase;
      display:flex;
      align-items:center;
      gap:8px;
      box-shadow: 0 6px 18px rgba(0,0,0,.08);
      user-select:none;
    }

    .btn:active{ transform: translateY(1px); }

    /* tiny red indicator (your “one pop of color”) */
    .led{
      width:8px;
      height:8px;
      border-radius:50%;
      background: rgba(176,24,24,.35);
      box-shadow: 0 0 0 1px rgba(0,0,0,.12);
    }

    .stage.spinning .led{
      background: rgba(176,24,24,.95);
      box-shadow: 0 0 10px rgba(176,24,24,.35);
    }

    /* hide the native audio UI completely */
    audio{ display:none; }
  </style>
</head>

<body>
  <main>
    <div class="brand">distant bugles</div>

    <p class="small">Music by Steve Ward and friends.</p>
    <hr>

    <p class="small">now playing: cold moon</p>

    <div id="stage" class="stage" aria-label="player">
      <div id="disc" class="disc" aria-hidden="true">
        <div class="discBase"></div>
        <div class="discGrooves"></div>
        <div class="discSheen"></div>
        <div class="label"><div class="hole"></div></div>
      </div>

      <div class="controls">
        <button id="toggle" class="btn" type="button" aria-label="play or stop">
          <span class="led" aria-hidden="true"></span>
          <span id="btnText">start</span>
        </button>
      </div>
    </div>

    <p class="small">things will change.</p>
    <p class="small">if you hear something you want: email me a lyric, a timestamp, or a description.</p>

    <p class="small">
      <a href="https://fauna-flora.bandcamp.com/album/fauna-flora" target="_blank" rel="noopener noreferrer">bandcamp</a>
      <span style="margin:0 10px;">·</span>
      <a href="mailto:faunafloramusic@gmail.com?subject=Hello">contact</a>
    </p>

    <audio id="player" preload="none">
      <source src="audio/cold_moon_16_44_1_FLAC_export_2026_01_12.flac" type="audio/flac">
    </audio>
  </main>

  <script>
  (() => {
    const audio = document.getElementById("player");
    const stage = document.getElementById("stage");
    const btn   = document.getElementById("toggle");
    const text  = document.getElementById("btnText");

    if (!audio || !stage || !btn || !text) return;

    const setUI = () => {
      const playing = !audio.paused && !audio.ended;
      stage.classList.toggle("spinning", playing);
      text.textContent = playing ? "stop" : "start";
      btn.setAttribute("aria-label", playing ? "stop" : "start");
    };

    btn.addEventListener("click", async () => {
      try{
        if (audio.paused || audio.ended) {
          await audio.play();
        } else {
          audio.pause();
          audio.currentTime = 0; // “stop” feel (resets to beginning)
        }
      } catch(e) {
        // if autoplay policy blocks, user can click again; no big UX drama
      }
      setUI();
    });

    audio.addEventListener("playing", setUI);
    audio.addEventListener("pause", setUI);
    audio.addEventListener("ended", setUI);

    // initial state
    setUI();
  })();
  </script>
</body>
</html>
