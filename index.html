<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>distant bugles</title>

  <style>
    :root{
      --fg:#111;
      --bg:#fff;
      --muted:rgba(0,0,0,.58);
      --rule:rgba(0,0,0,.10);
    }

    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font:18px/1.7 ui-monospace,"SF Mono",Menlo,Monaco,Consolas,"Liberation Mono","Courier New",Courier,monospace;
    }

    main{max-width:760px;margin:9vh auto;padding:0 22px}

    .brand{
      opacity:.75;
      letter-spacing:.18em;
      text-transform:lowercase;
      margin-bottom:14px;
    }

    .small{font-size:13px;color:var(--muted);margin:10px 0}
    hr{border:0;height:1px;background:var(--rule);margin:18px 0}
    a{color:inherit;text-decoration:underline;text-underline-offset:3px}

    /* ---- RECORD ---- */
    .recordWrap{
      margin-top:14px;
      display:flex;
      justify-content:center;
      align-items:center;
      /* no “big dumb rectangle” — just breathing room */
    }

    .disc{
      /* responsive size: big on desktop, still fits mobile */
      width:min(420px, 92vw);
      aspect-ratio:1 / 1;
      border-radius:50%;
      position:relative;
      box-shadow: 0 18px 55px rgba(0,0,0,.22);
      background:
        /* subtle vignette */
        radial-gradient(circle at 50% 45%, rgba(255,255,255,.06), rgba(0,0,0,0) 55%),
        /* grooves */
        repeating-radial-gradient(circle at center,
          rgba(255,255,255,.028) 0px,
          rgba(255,255,255,.028) 1px,
          rgba(0,0,0,0) 3px,
          rgba(0,0,0,0) 6px
        ),
        /* base vinyl */
        radial-gradient(circle at center, #2a2a2c 0%, #111114 62%, #0b0b0c 100%);
      overflow:hidden;
    }

    /* label */
    .label{
      position:absolute;
      inset:0;
      margin:auto;
      width:22%;
      aspect-ratio:1 / 1;
      border-radius:50%;
      background: radial-gradient(circle at center,
        rgba(255,255,255,.10),
        rgba(255,255,255,.04) 55%,
        rgba(255,255,255,.06)
      );
      border: 1px solid rgba(255,255,255,.10);
      display:flex;
      justify-content:center;
      align-items:center;
    }

    /* hole */
    .hole{
      width:10%;
      aspect-ratio:1 / 1;
      border-radius:50%;
      background: rgba(0,0,0,.85);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.10);
    }

    /* a faint rotating “sheen” so it feels alive */
    .sheen{
      position:absolute;
      inset:-35%;
      border-radius:50%;
      background: conic-gradient(
        from 0deg,
        rgba(255,255,255,.00),
        rgba(255,255,255,.06),
        rgba(255,255,255,.00),
        rgba(255,255,255,.00)
      );
      mix-blend-mode: screen;
      opacity:.65;
      pointer-events:none;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* spin both disc + sheen together */
    .recordWrap.spinning .disc{
      animation: spin 2.2s linear infinite;
    }

    /* Respect “reduce motion” users automatically */
    @media (prefers-reduced-motion: reduce){
      .recordWrap.spinning .disc{ animation: none; }
    }
  </style>
</head>

<body>
  <main>
    <div class="brand">distant bugles</div>

    <p class="small">Music by Steve Ward and friends.</p>
    <hr>

    <div style="margin:18px 0;">
      <div class="small">now playing: cold moon</div>

      <audio id="player" controls loop preload="none" style="width:100%; margin-top:8px;">
        <source src="audio/cold_moon_16_44_1_FLAC_export_2026_01_12.flac" type="audio/flac">
      </audio>

      <div id="recordWrap" class="recordWrap" aria-hidden="true">
        <div class="disc">
          <div class="sheen"></div>
          <div class="label"><div class="hole"></div></div>
        </div>
      </div>
    </div>

    <p class="small">things will change.</p>
    <p class="small">if you hear something you want: email me a lyric, a timestamp, or a description.</p>

    <p class="small">
      <a href="https://fauna-flora.bandcamp.com/album/fauna-flora" target="_blank" rel="noopener noreferrer">bandcamp</a>
      <span style="margin:0 10px;">·</span>
      <a href="mailto:faunafloramusic@gmail.com?subject=Hello">contact</a>
    </p>
  </main>

  <script>
  (() => {
    const audio = document.getElementById("player");
    const wrap  = document.getElementById("recordWrap");
    if (!audio || !wrap) return;

    const start = () => wrap.classList.add("spinning");
    const stop  = () => wrap.classList.remove("spinning");

    // more reliable than "play" alone in some browsers
    audio.addEventListener("playing", start);
    audio.addEventListener("play", start);
    audio.addEventListener("pause", stop);
    audio.addEventListener("ended", stop);

    // if already playing (rare), sync state
    if (!audio.paused && !audio.ended) start();
  })();
  </script>
</body>
</html>
