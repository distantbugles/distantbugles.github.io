<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>distant bugles</title>

  <style>
    :root{
      --fg:#111;
      --bg:#fff;
      --muted:rgba(0,0,0,.58);
      --rule:rgba(0,0,0,.10);
      --panel:#f6f6f4;

      --red:#b01818;
      --red2:#7f0f0f;
    }

    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font:18px/1.7 ui-monospace,"SF Mono",Menlo,Monaco,Consolas,"Liberation Mono","Courier New",Courier,monospace;
    }

    main{ max-width:560px; margin:9vh auto; padding:0 22px; }

    .brand{
      opacity:.85; letter-spacing:.18em; text-transform:lowercase;
      margin-bottom:10px; text-align:center; color:var(--red);
    }
    .byline{ text-align:center; margin:0 0 18px; font-size:13px; color:var(--muted); }

    .small{font-size:13px;color:var(--muted);margin:10px 0}
    a{color:inherit;text-decoration:underline;text-underline-offset:3px}

    .panel{
      background:var(--panel);
      border-radius:18px;
      padding:22px 18px 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,.06), inset 0 0 0 1px rgba(0,0,0,.06);
    }

    .stage{
      width:100%;
      aspect-ratio:11/10;
      position:relative;
      display:grid;
      place-items:center;
      overflow:visible;
    }

    .disc{ width:88%; aspect-ratio:1/1; border-radius:50%; position:relative; overflow:hidden; box-shadow:0 18px 55px rgba(0,0,0,.22); }
    .discBase{ position:absolute; inset:0; border-radius:50%;
      background:
        radial-gradient(circle at 50% 45%, rgba(255,255,255,.05), rgba(0,0,0,0) 55%),
        radial-gradient(circle at center, #2a2a2c 0%, #111114 62%, #0b0b0c 100%);
    }
    .discGrooves{ position:absolute; inset:0; border-radius:50%; opacity:.24;
      background: repeating-radial-gradient(circle at center,
        rgba(255,255,255,.06) 0px, rgba(255,255,255,.06) 1px,
        rgba(0,0,0,0) 3px, rgba(0,0,0,0) 6px
      );
      mix-blend-mode: screen;
      -webkit-mask-image: radial-gradient(circle at center, transparent 0 28%, #000 30% 100%);
      mask-image: radial-gradient(circle at center, transparent 0 28%, #000 30% 100%);
    }
    .discSheen{ position:absolute; inset:-35%; border-radius:50%; opacity:.32; transition:opacity 220ms ease;
      background: conic-gradient(
        from 0deg,
        rgba(255,255,255,0.00) 0deg, rgba(255,255,255,0.14) 22deg,
        rgba(255,255,255,0.00) 70deg, rgba(255,255,255,0.00) 180deg,
        rgba(255,255,255,0.10) 230deg, rgba(255,255,255,0.00) 290deg,
        rgba(255,255,255,0.00) 360deg
      );
      mix-blend-mode: screen;
      pointer-events:none;
    }
    .stage.fxOn .discSheen{ opacity:.46; }
