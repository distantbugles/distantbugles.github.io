<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>distant bugles</title>
  <style>
    :root {
      --fg:#111;
      --bg:#fff;
      --muted:rgba(0,0,0,.58);
      --rule:rgba(0,0,0,.10);
    }

    html, body { height:100%; }

    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font:18px/1.7 ui-monospace, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", Courier, monospace;
    }

    main{
      max-width:760px;
      margin:9vh auto;
      padding:0 22px;
    }

    .brand{
      opacity:.65;
      letter-spacing:.18em;
      text-transform:lowercase;
      margin-bottom:16px;
    }

    .small{
      font-size:13px;
      color:var(--muted);
      margin:10px 0;
    }

    hr{
      border:0;
      height:1px;
      background:var(--rule);
      margin:18px 0;
    }

    a{
      color:inherit;
      text-decoration:underline;
      text-underline-offset:3px;
    }

    /* record visual */
    .record{
      width:100%;
      height:180px;
      margin-top:12px;
      border:1px solid var(--rule);
      background:#0b0b0c;
      position:relative;
      overflow:hidden;
    }

    .record::before{
      content:"";
      position:absolute;
      left:50%; top:50%;
      width:150px; height:150px;
      transform:translate(-50%,-50%);
      border-radius:50%;
      background:
        radial-gradient(circle at center,
          rgba(255,255,255,.88) 0 2px,
          rgba(0,0,0,0) 2px 10px,
          rgba(255,255,255,.12) 10px 11px,
          rgba(255,255,255,.07) 11px 13px,
          rgba(255,255,255,.03) 13px 40px,
          rgba(255,255,255,.06) 40px 41px,
          rgba(255,255,255,.03) 41px 75px
        );
      box-shadow:0 10px 30px rgba(0,0,0,.35);
    }

    .record::after{
      content:"cold moon";
      position:absolute;
      left:50%; top:50%;
      width:52px; height:52px;
      transform:translate(-50%,-50%);
      border-radius:50%;
      display:grid;
      place-items:center;
      font-size:10px;
      letter-spacing:.12em;
      text-transform:lowercase;
      color:rgba(255,255,255,.78);
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.14);
    }

    @keyframes spin{
      from{ transform:translate(-50%,-50%) rotate(0); }
      to{ transform:translate(-50%,-50%) rotate(360deg); }
    }

    .record.spinning::before{
      animation:spin 2.2s linear infinite;
    }
  </style>
</head>

<body>
  <main>
    <div class="brand">distant bugles</div>

    <p class="small">Music by Steve Ward and friends.</p>

    <hr>

    <div style="margin: 18px 0;">
      <div class="small">now playing: cold moon</div>

      <audio id="player" controls loop preload="none" style="width:100%; margin-top:8px;">
        <source src="audio/cold_moon_16_44_1_FLAC_export_2026_01_12.flac" type="audio/flac">
      </audio>

      <div id="record" class="record" aria-hidden="true"></div>
    </div>

    <p class="small">things will change.</p>

    <p class="small">if you hear something you want: email me a lyric, a timestamp, or a description.</p>

    <p class="small">
      <a href="https://fauna-flora.bandcamp.com/album/fauna-flora" target="_blank" rel="noopener noreferrer">bandcamp</a>
      <span style="margin: 0 10px;">·</span>
      <a href="mailto:faunafloramusic@gmail.com?subject=Hello">contact</a>
    </p>
  </main>

  <script>
  (() => {
    const audio = document.getElementById("player");
    const record = document.getElementById("record");
    if (!audio || !record) return;

    audio.addEventListener("play",  () => record.classList.add("spinning"));
    audio.addEventListener("pause", () => record.classList.remove("spinning"));
    audio.addEventListener("ended", () => record.classList.remove("spinning"));
  })();
  </script>
</body>
</html>
