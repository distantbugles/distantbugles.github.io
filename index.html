<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>distant bugles</title>

  <style>
    :root{
      --fg:#111;
      --bg:#fff;
      --muted:rgba(0,0,0,.58);
      --rule:rgba(0,0,0,.10);
      --panel:#f6f6f4;

      /* accent red */
      --red:#b01818;
      --red2:#7f0f0f; /* deeper shadow tone */
    }

    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font:18px/1.7 ui-monospace,"SF Mono",Menlo,Monaco,Consolas,"Liberation Mono","Courier New",Courier,monospace;
    }

    main{
      max-width:560px;
      margin:9vh auto;
      padding:0 22px;
    }

    .brand{
      opacity:.85;
      letter-spacing:.18em;
      text-transform:lowercase;
      margin-bottom:10px;
      text-align:center;
      color:var(--red);
    }

    .byline{
      text-align:center;
      margin:0 0 18px;
      font-size:13px;
      color:var(--muted);
    }

    .small{font-size:13px;color:var(--muted);margin:10px 0}
    a{color:inherit;text-decoration:underline;text-underline-offset:3px}

    /* PANEL AROUND RECORD (subtle plinth) */
    .panel{
      background:var(--panel);
      border-radius:18px;
      padding:22px 18px 12px;
      box-shadow:
        0 16px 40px rgba(0,0,0,.06),
        inset 0 0 0 1px rgba(0,0,0,.06);
    }

    /* stage is layout only */
    .stage{
      width:100%;
      aspect-ratio: 11 / 10;
      position:relative;
      display:grid;
      place-items:center;
      overflow:visible;
    }

    /* record */
    .disc{
      width:88%;
      aspect-ratio:1/1;
      border-radius:50%;
      position:relative;
      overflow:hidden;
      box-shadow: 0 18px 55px rgba(0,0,0,.22);
    }

    .discBase{
      position:absolute; inset:0; border-radius:50%;
      background:
        radial-gradient(circle at 50% 45%, rgba(255,255,255,.05), rgba(0,0,0,0) 55%),
        radial-gradient(circle at center, #2a2a2c 0%, #111114 62%, #0b0b0c 100%);
    }

    .discGrooves{
      position:absolute; inset:0; border-radius:50%;
      opacity:.24;
      background: repeating-radial-gradient(circle at center,
        rgba(255,255,255,.06) 0px,
        rgba(255,255,255,.06) 1px,
        rgba(0,0,0,0) 3px,
        rgba(0,0,0,0) 6px
      );
      mix-blend-mode: screen;
      -webkit-mask-image: radial-gradient(circle at center, transparent 0 28%, #000 30% 100%);
      mask-image: radial-gradient(circle at center, transparent 0 28%, #000 30% 100%);
    }

    .discSheen{
      position:absolute; inset:-35%;
      border-radius:50%;
      opacity:.32;
      background: conic-gradient(
        from 0deg,
        rgba(255,255,255,0.00) 0deg,
        rgba(255,255,255,0.14) 22deg,
        rgba(255,255,255,0.00) 70deg,
        rgba(255,255,255,0.00) 180deg,
        rgba(255,255,255,0.10) 230deg,
        rgba(255,255,255,0.00) 290deg,
        rgba(255,255,255,0.00) 360deg
      );
      mix-blend-mode: screen;
      pointer-events:none;
    }

    /* LABEL: gray when paused, red when playing */
    .label{
      position:absolute; inset:0; margin:auto;
      width:22%;
      aspect-ratio:1/1;
      border-radius:50%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,.12), rgba(255,255,255,0) 55%),
        radial-gradient(circle at center, rgba(60,60,60,.95) 0%, rgba(35,35,35,.95) 70%, rgba(0,0,0,.35) 100%);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow:
        inset 0 0 0 6px rgba(0,0,0,.18),
        0 0 0 1px rgba(0,0,0,.08);
      display:flex; justify-content:center; align-items:center;
      transition: background 220ms ease, border-color 220ms ease;
    }

    .stage.spinning .label{
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,.18), rgba(255,255,255,0) 55%),
        radial-gradient(circle at center, var(--red) 0%, var(--red2) 70%, rgba(0,0,0,.30) 100%);
      border-color: rgba(255,255,255,.16);
    }

    .hole{
      width:28%;
      aspect-ratio:1/1;
      border-radius:50%;
      background: rgba(0,0,0,.88);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.10);
    }

    @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
    .stage.spinning .disc{ animation: spin 2.2s linear infinite; }

    @media (prefers-reduced-motion: reduce){
      .stage.spinning .disc{ animation:none; }
    }

    /* now playing (inside panel) */
    .np{
      margin-top:8px;
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:14px;
    }

    .npText{
      opacity:0;
      transform: translateY(4px);
      transition: opacity 260ms ease, transform 260ms ease;
    }

    .stage.spinning ~ .np .npText{
      opacity:1;
      transform: translateY(0);
    }

    /* now playing: BLACK (italic) */
    .npLabel{
      font-size:13px;
      color:rgba(0,0,0,.78);
      font-style: italic;
      letter-spacing:.04em;
      text-transform:lowercase;
    }

    .npLabel span{
      display:inline-block;
      transform: translateX(.35ch);
    }

    /* song title: RED and slightly smaller + tighter spacing */
    .npTitle{
      margin-top:1px;
      font-size:15px;
      color:var(--red);
      letter-spacing:.11em;
      text-transform:lowercase;
    }

    /* artist line: red, with a subtle "by:" prefix */
    .npArtistLine{
      margin-top:2px;
      font-size:13px;
      color:var(--red);
      letter-spacing:.04em;
      text-transform:lowercase;
    }

    .npArtistLine .by{
      opacity:.85;
      margin-right:6px;
    }

    /* timer unchanged */
    .npTime{
      margin-top:1px;
      font-size:13px;
      color:rgba(0,0,0,.45);
      font-style: italic;
      letter-spacing:.04em;
      text-transform:lowercase;
    }

    /* power button — “finished” */
    .powerBtn{
      appearance:none;
      border:2px solid rgba(0,0,0,.28);
      background: rgba(255,255,255,.94);
      border-radius:999px;
      width:56px;
      height:56px;
      display:grid;
      place-items:center;
      cursor:pointer;
      box-shadow:
        0 10px 26px rgba(0,0,0,.12),
        inset 0 0 0 1px rgba(255,255,255,.65);
      flex:0 0 auto;
      transition: border-color 200ms ease, box-shadow 200ms ease;
    }
    .powerBtn:active{ transform: translateY(1px); }

    .powerIcon{
      width:22px;
      height:22px;
      opacity:.90;
      color: rgba(0,0,0,.78);
      transition: color 200ms ease, filter 200ms ease;
    }

    .stage.spinning ~ .np .powerIcon{
      color: var(--red);
      filter: drop-shadow(0 0 9px rgba(176,24,24,.25));
    }
    .stage.spinning ~ .np .powerBtn{
      border-color: rgba(176,24,24,.35);
    }

    /* footer */
    .footer{
      margin-top:18px;
      text-align:left;
    }
    .footerCenter{
      text-align:center;
    }

    /* Hide native audio UI */
    audio{ display:none; }
  </style>
</head>

<body>
  <main>
    <div class="brand">distant bugles</div>
    <p class="byline">music by Steve Ward and friends</p>

    <div class="panel">
      <div id="stage" class="stage" aria-label="player">
        <div class="disc" aria-hidden="true">
          <div class="discBase"></div>
          <div class="discGrooves"></div>
          <div class="discSheen"></div>
          <div class="label"><div class="hole"></div></div>
        </div>
      </div>

      <div class="np">
        <div class="npText" aria-hidden="true">
          <div class="npLabel"><span>now playing:</span></div>
          <div class="npTitle" id="trackTitle">loading…</div>
          <div class="npArtistLine" id="artistLine">
            <span class="by">by:</span><span id="trackArtist"></span>
          </div>
          <div class="npTime" id="trackTime">0:00 / 0:00</div>
        </div>

        <button id="toggle" class="powerBtn" type="button" aria-label="play or pause">
          <svg class="powerIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2v9"></path>
            <path d="M7.5 4.8a8 8 0 1 0 9 0"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="footer">
      <p class="small footerCenter">things will change.</p>
      <p class="small">if you hear something you want: email me a lyric, a timestamp, or a description.</p>

      <p class="small">
        <a href="https://fauna-flora.bandcamp.com/album/fauna-flora" target="_blank" rel="noopener noreferrer">bandcamp</a>
        <span style="margin:0 10px;">·</span>
        <a href="mailto:faunafloramusic@gmail.com?subject=Hello">contact</a>
      </p>
    </div>

    <audio id="player" preload="none"></audio>
  </main>

  <script>
  (() => {
    const audio = document.getElementById("player");
    const stage = document.getElementById("stage");
    const btn   = document.getElementById("toggle");
    const titleEl = document.getElementById("trackTitle");
    const artistEl = document.getElementById("trackArtist");
    const artistLine = document.getElementById("artistLine");
    const timeEl = document.getElementById("trackTime");

    if (!audio || !stage || !btn || !titleEl || !artistEl || !artistLine || !timeEl) return;

    let queue = [];
    let idx = 0;
    let ready = false;

    const fmt = (s) => {
      s = Math.max(0, Math.floor(s || 0));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return m + ":" + String(r).padStart(2, "0");
    };

    const updateTime = () => {
      const cur = audio.currentTime || 0;
      const dur = (isFinite(audio.duration) && audio.duration) ? audio.duration : 0;
      timeEl.textContent = `${fmt(cur)} / ${fmt(dur)}`;
    };

    const shuffle = (arr) => {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    };

    const setUI = () => {
      const playing = !audio.paused && !audio.ended;
      stage.classList.toggle("spinning", playing);
      btn.setAttribute("aria-label", playing ? "pause" : "play");
      updateTime();
    };

    const setTrack = (t, autoplay) => {
      audio.src = encodeURI(t.file);

      const title = (t.title || "").toLowerCase();
      const artist = (t.artist || "").toLowerCase();

      titleEl.textContent = title || "unknown";
      artistEl.textContent = artist;

      // hide artist line if missing
      artistLine.style.display = artist ? "" : "none";

      audio.load();
      updateTime();
      if (autoplay) audio.play().catch(() => {});
    };

    const nextTrack = (autoplay) => {
      if (!queue.length) return;
      idx = (idx + 1) % queue.length;
      setTrack(queue[idx], autoplay);
    };

    btn.addEventListener("click", async () => {
      if (!ready) return;

      try{
        if (audio.paused || audio.ended) {
          if (!audio.src) setTrack(queue[idx], false);
          await audio.play();
        } else {
          audio.pause();
        }
      } catch(e) {}
      setUI();
    });

    audio.addEventListener("ended", () => {
      nextTrack(true);
      setUI();
    });

    audio.addEventListener("playing", setUI);
    audio.addEventListener("pause", setUI);
    audio.addEventListener("timeupdate", updateTime);
    audio.addEventListener("loadedmetadata", updateTime);

    fetch("playlist.json", { cache: "no-store" })
      .then(r => r.json())
      .then(list => {
        const tracks = Array.isArray(list) ? list : [];
        queue = shuffle([...tracks]);
        idx = 0;
        ready = queue.length > 0;

        if (ready) setTrack(queue[idx], false);
        else titleEl.textContent = "no tracks";

        setUI();
      })
      .catch(() => {
        ready = false;
        titleEl.textContent = "playlist missing";
        artistEl.textContent = "";
        artistLine.style.display = "none";
        timeEl.textContent = "0:00 / 0:00";
        setUI();
      });
  })();
  </script>
</body>
</html>
